<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>EducaVR - Aprende Jugando</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<style>
  body { margin:0; font-family: sans-serif; }
</style>
</head>
<body>
<a-scene>
  <!-- Cámara VR con cursor de mirada -->
  <a-entity position="0 1.6 0">
    <a-camera>
      <a-cursor color="yellow" fuse="true" fuse-timeout="1500"
        geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03">
      </a-cursor>
    </a-camera>
  </a-entity>

  <a-sky color="#87CEEB"></a-sky>
  <a-plane position="0 0 -4" rotation="-90 0 0" width="30" height="30" color="#7CFC00"></a-plane>

  <!-- TITULO -->
  <a-text id="titulo" value="EDUCA VR" position="-1.5 3.5 -4" color="white" width="8"></a-text>
  <a-text id="instruccion" value="Mira un boton 2 segundos para elegir" position="-2.2 3 -4" color="black" width="6"></a-text>
  <a-text id="pregunta" value="Elige un mundo para aprender" position="-2 2.5 -4" color="#333" width="6"></a-text>
  <a-text id="puntaje" value="Puntos: 0" position="2.2 3.5 -4" color="gold" width="5"></a-text>

  <!-- BOTONES DE MUNDOS -->
  <a-box id="btn-numeros" position="-2 1.5 -4" color="#FF6B6B" depth="0.3" height="0.8" width="1.8"></a-box>
  <a-text value="NUMEROS" position="-2.6 1.5 -3.7" color="white" width="4"></a-text>

  <a-box id="btn-colores" position="0 1.5 -4" color="#4ECDC4" depth="0.3" height="0.8" width="1.8"></a-box>
  <a-text value="ANIMALES" position="-0.6 1.5 -3.7" color="white" width="4"></a-text>

  <a-box id="btn-formas" position="2 1.5 -4" color="#FFD93D" depth="0.3" height="0.8" width="1.8"></a-box>
  <a-text value="FORMAS" position="1.4 1.5 -3.7" color="black" width="4"></a-text>

  <!-- ZONA DE JUEGO: Aqui aparecen las respuestas -->
  <a-entity id="zona-juego" position="0 0.5 -3.5" visible="false">
    <a-sphere id="opcion1" position="-1.5 1 -0.5" radius="0.5" color="red"></a-sphere>
    <a-text id="txt1" value="?" position="-1.7 1 0.1" color="white" width="3"></a-text>

    <a-sphere id="opcion2" position="0 1 -0.5" radius="0.5" color="blue"></a-sphere>
    <a-text id="txt2" value="?" position="-0.2 1 0.1" color="white" width="3"></a-text>

    <a-sphere id="opcion3" position="1.5 1 -0.5" radius="0.5" color="green"></a-sphere>
    <a-text id="txt3" value="?" position="1.3 1 0.1" color="white" width="3"></a-text>
  </a-entity>

</a-scene>

<script>
  let puntos = 0;
  let modoActual = "";
  let respuestaCorrecta = 0;

  const preguntaEl = document.querySelector('#pregunta');
  const puntajeEl = document.querySelector('#puntaje');
  const zonaJuego = document.querySelector('#zona-juego');

  function hablar(texto) {
    const voz = new SpeechSynthesisUtterance(texto);
    voz.lang = 'es-MX';
    voz.rate = 0.9;
    speechSynthesis.speak(voz);
  }

  function actualizarPuntos() {
    puntajeEl.setAttribute('value', 'Puntos: ' + puntos);
  }

  function nuevaPregunta(modo) {
    modoActual = modo;
    zonaJuego.setAttribute('visible', true);
    let num1 = Math.floor(Math.random() * 5) + 1;
    let num2 = Math.floor(Math.random() * 5) + 1;
    let correcta = num1 + num2;

    if (modo === 'numeros') {
      preguntaEl.setAttribute('value', `Cuanto es ${num1} + ${num2} ?`);
      hablar(`¿Cuánto es ${num1} más ${num2}?`);
      // Generar 3 opciones, una es la correcta
      let opciones = [correcta, correcta + 1, correcta + 2];
      opciones = opciones.sort(() => Math.random() - 0.5);
      respuestaCorrecta = opciones.indexOf(correcta);

      document.querySelector('#txt1').setAttribute('value', opciones[0]);
      document.querySelector('#txt2').setAttribute('value', opciones[1]);
      document.querySelector('#txt3').setAttribute('value', opciones[2]);
    }

    if (modo === 'animales') {
      const animales = [
        { nombre: 'GATO', color: 'orange' },
        { nombre: 'PERRO', color: 'brown' },
        { nombre: 'PATO', color: 'yellow' }
      ];
      let animal = animales[Math.floor(Math.random() * animales.length)];
      preguntaEl.setAttribute('value', `Toca el ${animal.nombre}`);
      hablar(`Toca el ${animal.nombre}`);
      // Simplificado: la respuesta correcta es la esfera del color del animal
      document.querySelector('#txt1').setAttribute('value', 'GATO');
      document.querySelector('#txt2').setAttribute('value', 'PERRO');
      document.querySelector('#txt3').setAttribute('value', 'PATO');
      respuestaCorrecta = animales.indexOf(animal);
    }

    if (modo === 'formas') {
      preguntaEl.setAttribute('value', `Toca la esfera VERDE`);
      hablar(`Toca la esfera verde`);
      document.querySelector('#opcion1').setAttribute('color', 'red');
      document.querySelector('#opcion2').setAttribute('color', 'green');
      document.querySelector('#opcion3').setAttribute('color', 'blue');
      document.querySelector('#txt1').setAttribute('value', '');
      document.querySelector('#txt2').setAttribute('value', '');
      document.querySelector('#txt3').setAttribute('value', '');
      respuestaCorrecta = 1;
    }
  }

  function verificar(indice) {
    if (indice === respuestaCorrecta) {
      puntos += 10;
      hablar('¡Muy bien! ¡Correcto!');
      preguntaEl.setAttribute('value', '¡CORRECTO! +10 puntos');
    } else {
      hablar('Casi, intentalo de nuevo');
      preguntaEl.setAttribute('value', 'Casi, intentalo otra vez');
    }
    actualizarPuntos();
    setTimeout(() => nuevaPregunta(modoActual), 2000);
  }

  // Eventos de click por mirada (fuse)
  document.querySelector('#btn-numeros').addEventListener('click', () => nuevaPregunta('numeros'));
  document.querySelector('#btn-colores').addEventListener('click', () => nuevaPregunta('animales'));
  document.querySelector('#btn-formas').addEventListener('click', () => nuevaPregunta('formas'));

  document.querySelector('#opcion1').addEventListener('click', () => verificar(0));
  document.querySelector('#opcion2').addEventListener('click', () => verificar(1));
  document.querySelector('#opcion3').addEventListener('click', () => verificar(2));
</script>
</body>
</html>

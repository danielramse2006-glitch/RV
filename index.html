<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>EducaVR | Aprende jugando</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <style>
    body { margin: 0; overflow: hidden; background: #101d2d; font-family: Arial, sans-serif; }
    .nota { position: fixed; left: 50%; bottom: 8px; transform: translateX(-50%); z-index: 2;
      color: white; background: rgba(0,0,0,.45); padding: 7px 12px; border-radius: 12px;
      font-size: 12px; text-align: center; pointer-events: none; }
    @media (max-width: 600px) { .nota { font-size: 11px; } }
  </style>
</head>
<body>
  <div class="nota">Sin visor: mira el centro o pulsa una tarjeta · Con visor: entra en VR</div>
  <a-scene background="color: #A9DFF5" renderer="antialias: true; colorManagement: true"
           vr-mode-ui="enabled: true">
    <a-light type="ambient" color="#FFFFFF" intensity="0.88"></a-light>
    <a-light type="directional" position="-2 5 2" intensity="0.6"></a-light>

    <!-- Mundo sencillo, con colores suaves para no distraer. -->
    <a-sky color="#A9DFF5"></a-sky>
    <a-plane position="0 -0.02 -4" rotation="-90 0 0" width="60" height="60" color="#77BF92"></a-plane>
    <a-circle position="0 0.005 -3.8" rotation="-90 0 0" radius="3.7" color="#DCF4E0"></a-circle>
    <a-cylinder position="-4.5 0.65 -7" radius="0.2" height="1.3" color="#876A52"></a-cylinder>
    <a-sphere position="-4.5 1.75 -7" radius="0.95" color="#5C9E76"></a-sphere>
    <a-cylinder position="4.5 0.65 -7" radius="0.2" height="1.3" color="#876A52"></a-cylinder>
    <a-sphere position="4.5 1.75 -7" radius="0.95" color="#5C9E76"></a-sphere>

    <!-- Cámara a altura de los ojos. Solo detecta los elementos interactivos. -->
    <a-entity position="0 1.6 0">
      <a-camera wasd-controls-enabled="false">
        <a-cursor fuse="true" fuse-timeout="1500" color="#FFD54A"
                  raycaster="objects: .interactivo"
                  geometry="primitive: ring; radiusInner: 0.012; radiusOuter: 0.019"
                  material="shader: flat; color: #FFD54A; opacity: 0.9"
                  position="0 0 -1"></a-cursor>
      </a-camera>
    </a-entity>
    <!-- También permite seleccionar haciendo clic/tap en modo normal. -->
    <a-entity cursor="rayOrigin: mouse" raycaster="objects: .interactivo"></a-entity>

    <!-- MENÚ. Tiene su propio espacio y desaparece cuando empieza el juego. -->
    <a-entity id="menu" position="0 1.6 -3.7">
      <a-plane width="3.92" height="2.35" position="0 0 -0.12"
               color="#233B5A" material="shader: flat; transparent: true; opacity: 0.93"></a-plane>
      <a-text value="EDUCA VR" position="0 0.82 0.02" align="center" anchor="center"
              color="#FFFFFF" width="5.7" wrap-count="22"></a-text>
      <a-text value="¡Elige un mundo para aprender!" position="0 0.48 0.02" align="center"
              color="#D2EDFC" width="4.6" wrap-count="37"></a-text>

      <a-entity position="-1.18 -0.15 0.08">
        <a-box class="interactivo" data-modo="numeros" width="1.05" height="1.0" depth="0.12"
               color="#E65C74"></a-box>
        <a-text value="1 + 2" position="0 0.13 0.10" align="center" color="#FFFFFF"
                width="4" wrap-count="18"></a-text>
        <a-text value="NÚMEROS" position="0 -0.26 0.10" align="center" color="#FFFFFF"
                width="3.5" wrap-count="29"></a-text>
      </a-entity>
      <a-entity position="0 -0.15 0.08">
        <a-box class="interactivo" data-modo="animales" width="1.05" height="1.0" depth="0.12"
               color="#2EA6A1"></a-box>
        <a-sphere position="0 0.14 0.24" radius="0.21" color="#FFC06C"></a-sphere>
        <a-cone position="-0.14 0.35 0.23" radius-bottom="0.09" height="0.19" color="#FFC06C"></a-cone>
        <a-cone position="0.14 0.35 0.23" radius-bottom="0.09" height="0.19" color="#FFC06C"></a-cone>
        <a-text value="ANIMALES" position="0 -0.26 0.10" align="center" color="#FFFFFF"
                width="3.5" wrap-count="29"></a-text>
      </a-entity>
      <a-entity position="1.18 -0.15 0.08">
        <a-box class="interactivo" data-modo="formas" width="1.05" height="1.0" depth="0.12"
               color="#EAB64C"></a-box>
        <a-cone position="0 0.13 0.17" radius-bottom="0.19" height="0.38" color="#FFFFFF"></a-cone>
        <a-text value="FORMAS" position="0 -0.26 0.10" align="center" color="#213048"
                width="3.5" wrap-count="29"></a-text>
      </a-entity>

      <a-text value="Apunta la mirada durante 1.5 segundos" position="0 -0.93 0.04"
              color="#DBEDF7" align="center" width="4.7" wrap-count="42"></a-text>
    </a-entity>

    <!-- PANTALLA DE JUEGO (separada y oculta al principio). -->
    <a-entity id="juego" position="0 -1000 -3.7" visible="false">
      <a-plane width="3.92" height="2.35" position="0 0 -0.12"
               color="#233B5A" material="shader: flat; transparent: true; opacity: 0.93"></a-plane>

      <a-box id="volver" class="interactivo" position="-1.45 0.90 0.05"
             width="0.83" height="0.32" depth="0.09" color="#65799B"></a-box>
      <a-text value="VOLVER" position="-1.45 0.90 0.12" align="center" color="#FFFFFF"
              width="2.2" wrap-count="30"></a-text>

      <a-text id="puntos" value="PUNTOS: 0" position="1.0 0.91 0.07" align="center"
              color="#FFD663" width="3.5" wrap-count="25"></a-text>
      <a-text id="pregunta" value="" position="0 0.47 0.05" align="center"
              color="#FFFFFF" width="4.5" wrap-count="34"></a-text>

      <a-entity id="tarjeta0" position="-1.18 -0.20 0.08">
        <a-box class="interactivo opcion" data-idx="0" width="1.05" height="1.04" depth="0.12" color="#F3F5FF"></a-box>
        <a-entity class="modelo" position="0 0.10 0.20"></a-entity>
        <a-text class="etiqueta" value="" position="0 -0.31 0.17" align="center" color="#263852"
                width="3.6" wrap-count="28"></a-text>
      </a-entity>
      <a-entity id="tarjeta1" position="0 -0.20 0.08">
        <a-box class="interactivo opcion" data-idx="1" width="1.05" height="1.04" depth="0.12" color="#F3F5FF"></a-box>
        <a-entity class="modelo" position="0 0.10 0.20"></a-entity>
        <a-text class="etiqueta" value="" position="0 -0.31 0.17" align="center" color="#263852"
                width="3.6" wrap-count="28"></a-text>
      </a-entity>
      <a-entity id="tarjeta2" position="1.18 -0.20 0.08">
        <a-box class="interactivo opcion" data-idx="2" width="1.05" height="1.04" depth="0.12" color="#F3F5FF"></a-box>
        <a-entity class="modelo" position="0 0.10 0.20"></a-entity>
        <a-text class="etiqueta" value="" position="0 -0.31 0.17" align="center" color="#263852"
                width="3.6" wrap-count="28"></a-text>
      </a-entity>
      <a-text id="mensaje" value="Elige una respuesta mirando una tarjeta" position="0 -0.93 0.04"
              align="center" color="#D2EDFC" width="4.9" wrap-count="43"></a-text>
    </a-entity>
  </a-scene>

  <script>
    let puntos = 0;
    let modo = '';
    let respuestaCorrecta = -1;
    let ocupado = false;
    let temporizador = null;
    const menu = document.querySelector('#menu');
    const juego = document.querySelector('#juego');
    const pregunta = document.querySelector('#pregunta');
    const mensaje = document.querySelector('#mensaje');
    const puntosEl = document.querySelector('#puntos');
    const tarjetas = [0, 1, 2].map(n => document.querySelector('#tarjeta' + n));

    function hablar(texto) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const voz = new SpeechSynthesisUtterance(texto);
      voz.lang = 'es-MX';
      voz.rate = 0.92;
      window.speechSynthesis.speak(voz);
    }

    function mezclar(lista) {
      const r = [...lista];
      for (let i = r.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [r[i], r[j]] = [r[j], r[i]];
      }
      return r;
    }

    function pantalla(cual) {
      const mostrandoJuego = cual === 'juego';
      menu.setAttribute('visible', !mostrandoJuego);
      juego.setAttribute('visible', mostrandoJuego);
      // Alejar físicamente la pantalla oculta evita clics fantasma por la mirada.
      menu.setAttribute('position', mostrandoJuego ? '0 -1000 -3.7' : '0 1.6 -3.7');
      juego.setAttribute('position', mostrandoJuego ? '0 1.6 -3.7' : '0 -1000 -3.7');
    }

    function pieza(padre, tipo, atributos) {
      const el = document.createElement(tipo);
      Object.entries(atributos).forEach(([nombre, valor]) => el.setAttribute(nombre, valor));
      padre.appendChild(el);
      return el;
    }

    function dibujarAnimal(padre, animal) {
      const modelo = pieza(padre, 'a-entity', {scale: '0.85 0.85 0.85'});
      if (animal === 'GATO') {
        pieza(modelo, 'a-sphere', {position: '0 0 0', radius: '0.26', color: '#F9A65D'});
        pieza(modelo, 'a-cone', {position: '-0.17 0.23 0', 'radius-bottom': '0.12', height: '0.25', color: '#F9A65D'});
        pieza(modelo, 'a-cone', {position: '0.17 0.23 0', 'radius-bottom': '0.12', height: '0.25', color: '#F9A65D'});
      } else if (animal === 'PERRO') {
        pieza(modelo, 'a-sphere', {position: '0 0 0', radius: '0.26', color: '#B47A54'});
        pieza(modelo, 'a-sphere', {position: '-0.27 0.05 0', scale: '0.14 0.25 0.12', color: '#764A38'});
        pieza(modelo, 'a-sphere', {position: '0.27 0.05 0', scale: '0.14 0.25 0.12', color: '#764A38'});
        pieza(modelo, 'a-sphere', {position: '0 -0.12 0.24', radius: '0.12', color: '#E8CAA0'});
      } else {
        pieza(modelo, 'a-sphere', {position: '0 -0.08 0', radius: '0.26', color: '#F8D24F'});
        pieza(modelo, 'a-sphere', {position: '0 0.18 0.08', radius: '0.20', color: '#F8D24F'});
        pieza(modelo, 'a-box', {position: '0 0.10 0.28', width: '0.22', height: '0.08', depth: '0.18', color: '#F28B42'});
      }
      if (animal !== 'PATO') {
        pieza(modelo, 'a-sphere', {position: '-0.105 0.06 0.23', radius: '0.032', color: '#172239'});
        pieza(modelo, 'a-sphere', {position: '0.105 0.06 0.23', radius: '0.032', color: '#172239'});
        pieza(modelo, 'a-sphere', {position: '0 -0.06 0.275', radius: '0.045', color: '#45333A'});
      } else {
        pieza(modelo, 'a-sphere', {position: '-0.09 0.22 0.25', radius: '0.025', color: '#172239'});
        pieza(modelo, 'a-sphere', {position: '0.09 0.22 0.25', radius: '0.025', color: '#172239'});
      }
    }

    function dibujarForma(padre, forma) {
      const c = {ESFERA: '#5FBBF5', CUBO: '#F39E61', CONO: '#9C86EF'}[forma];
      if (forma === 'ESFERA') pieza(padre, 'a-sphere', {radius: '0.28', color: c});
      if (forma === 'CUBO') pieza(padre, 'a-box', {width: '0.48', height: '0.48', depth: '0.42', rotation: '15 25 0', color: c});
      if (forma === 'CONO') pieza(padre, 'a-cone', {'radius-bottom': '0.27', height: '0.57', color: c});
    }

    function pintarOpciones(opciones) {
      tarjetas.forEach((tarjeta, i) => {
        const modelo = tarjeta.querySelector('.modelo');
        const etiqueta = tarjeta.querySelector('.etiqueta');
        // Limpiar los modelos de la pregunta anterior.
        while (modelo.firstChild) modelo.removeChild(modelo.firstChild);
        etiqueta.setAttribute('value', String(opciones[i]));
        tarjeta.querySelector('.opcion').setAttribute('color', '#F3F5FF');
        if (modo === 'numeros') {
          pieza(modelo, 'a-sphere', {radius: '0.27', color: ['#FA7C7E','#61B9E8','#8FCF8A'][i]});
          pieza(modelo, 'a-text', {value: String(opciones[i]), align: 'center',
            position: '0 -0.08 0.26', color: '#FFFFFF', width: '4.2', 'wrap-count': '18'});
          etiqueta.setAttribute('value', 'RESULTADO');
        } else if (modo === 'animales') {
          dibujarAnimal(modelo, opciones[i]);
        } else {
          dibujarForma(modelo, opciones[i]);
        }
      });
    }

    function nuevaPregunta() {
      if (!modo) return;
      ocupado = false;
      mensaje.setAttribute('value', 'Mira la tarjeta correcta durante 1.5 s');
      mensaje.setAttribute('color', '#D2EDFC');
      let opciones, correcta, preguntaTexto;

      if (modo === 'numeros') {
        const a = 1 + Math.floor(Math.random() * 5);
        const b = 1 + Math.floor(Math.random() * 5);
        correcta = a + b;
        const incorrectas = mezclar([...Array(11).keys()].filter(n => n >= 2 && n !== correcta)).slice(0, 2);
        opciones = mezclar([correcta, ...incorrectas]);
        preguntaTexto = `¿CUÁNTO ES ${a} + ${b}?`;
      } else if (modo === 'animales') {
        opciones = mezclar(['GATO', 'PERRO', 'PATO']);
        correcta = ['GATO', 'PERRO', 'PATO'][Math.floor(Math.random() * 3)];
        preguntaTexto = `ENCUENTRA EL ${correcta}`;
      } else {
        opciones = mezclar(['ESFERA', 'CUBO', 'CONO']);
        correcta = ['ESFERA', 'CUBO', 'CONO'][Math.floor(Math.random() * 3)];
        preguntaTexto = `ENCUENTRA EL ${correcta}`.replace('EL ESFERA', 'LA ESFERA');
      }
      respuestaCorrecta = opciones.indexOf(correcta);
      pregunta.setAttribute('value', preguntaTexto);
      pintarOpciones(opciones);
      hablar(preguntaTexto);
    }

    function iniciar(modoElegido) {
      clearTimeout(temporizador);
      modo = modoElegido;
      ocupado = false;
      pantalla('juego');
      nuevaPregunta();
    }

    function volver() {
      clearTimeout(temporizador);
      modo = '';
      ocupado = false;
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      pantalla('menu');
    }

    function responder(indice) {
      if (!modo || ocupado) return;
      const tarjeta = tarjetas[indice].querySelector('.opcion');
      if (indice === respuestaCorrecta) {
        ocupado = true;
        puntos += 10;
        puntosEl.setAttribute('value', 'PUNTOS: ' + puntos);
        tarjeta.setAttribute('color', '#70D89B');
        mensaje.setAttribute('value', '¡CORRECTO! +10 PUNTOS');
        mensaje.setAttribute('color', '#82F0AF');
        hablar('¡Muy bien! ¡Correcto!');
        temporizador = setTimeout(nuevaPregunta, 2100);
      } else {
        ocupado = true;
        tarjeta.setAttribute('color', '#FF9B9B');
        mensaje.setAttribute('value', 'CASI, PRUEBA OTRA TARJETA');
        mensaje.setAttribute('color', '#FFD0D0');
        hablar('Casi, inténtalo otra vez');
        temporizador = setTimeout(() => {
          if (!modo) return;
          tarjeta.setAttribute('color', '#F3F5FF');
          mensaje.setAttribute('value', 'Mira la tarjeta correcta durante 1.5 s');
          mensaje.setAttribute('color', '#D2EDFC');
          ocupado = false;
        }, 1100);
      }
    }

    document.querySelectorAll('[data-modo]').forEach(el =>
      el.addEventListener('click', () => iniciar(el.dataset.modo)));
    document.querySelectorAll('.opcion').forEach(el =>
      el.addEventListener('click', () => responder(Number(el.dataset.idx))));
    document.querySelector('#volver').addEventListener('click', volver);
  </script>
</body>
</html>
